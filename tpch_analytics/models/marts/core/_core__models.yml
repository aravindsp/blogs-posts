version: 2

models:
  - name: fct_order_items
    description: One row per order line with amounts. Incremental on _loaded_at.
    columns:
      - name: order_item_key
        data_tests: [unique, not_null]
      - name: net_amount
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

  - name: fct_orders
    description: One row per order with totals rolled up from order items.
    columns:
      - name: order_key
        data_tests: [unique, not_null]
      - name: customer_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_key

  - name: dim_customers
    description: One row per customer with geography and order history.
    columns:
      - name: customer_key
        data_tests: [unique, not_null]
      - name: region_name
        data_tests: [not_null]
