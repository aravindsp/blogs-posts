version: 2

sources:
  - name: tpch
    database: raw
    schema: tpch
    description: TPC-H retail data loaded into the RAW database (part 3).
    tables:
      - name: orders
        loaded_at_field: _loaded_at
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 48, period: hour}
      - name: lineitem
        loaded_at_field: _loaded_at
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 48, period: hour}
      - name: customer
      - name: nation
      - name: region
      - name: part
      - name: supplier
