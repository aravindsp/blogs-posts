version: 2

models:
  - name: stg_tpch__orders
    description: One row per order, renamed and typed.
    columns:
      - name: order_key
        data_tests: [unique, not_null]
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['fulfilled', 'open', 'partially_fulfilled']
      - name: customer_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tpch__customers')
                field: customer_key

  - name: stg_tpch__line_items
    description: One row per order line.
    columns:
      - name: order_item_key
        data_tests: [unique, not_null]
      - name: discount_rate
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 0.1

  - name: stg_tpch__customers
    columns:
      - name: customer_key
        data_tests: [unique, not_null]
